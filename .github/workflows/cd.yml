name: CD

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Publish container image
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # Add an immutable full-SHA tag for the deployment job.
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    needs: publish
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Copy deployment definition
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ secrets.OCI_APP_DIR }}
          overwrite: true

      - name: Copy resume to persisted data directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: src/main/resources/Honey_SDE_Resume.pdf
          target: ${{ secrets.OCI_APP_DIR }}/data
          strip_components: 3
          overwrite: true

      - name: Deploy on Oracle Cloud VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.OCI_APP_DIR }}"

            # Deploy the exact image built for this workflow run, not mutable latest.
            export IMAGE_NAME="${{ env.IMAGE_NAME }}:${{ github.sha }}"

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            # Pull and recreate so the VM cannot retain an older application image.
            docker compose pull
            docker compose up -d --no-build --force-recreate --remove-orphans

            # Fail the deployment if the recreated container is not running.
            docker compose ps
            test "$(docker inspect -f '{{.State.Status}}' naukri-auto-updater)" = "running"

            docker image prune -f