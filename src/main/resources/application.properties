spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
spring.datasource.url=jdbc:sqlite:${DB_FILE:./data/naukri.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always

naukri.username=${NAUKRI_USERNAME:}
naukri.password=${NAUKRI_PASSWORD:}

naukri.resume-path=${NAUKRI_RESUME_PATH:}

naukri.profile-url=${NAUKRI_PROFILE_URL:https://www.naukri.com/mnjuser/profile}
naukri.update-cron=${UPDATE_CRON:0 * * * * *}
naukri.timezone=${TIMEZONE:Asia/Kolkata}
naukri.headless=${HEADLESS:true}

# These selectors are intentionally configurable because Naukri can change its UI.
naukri.selectors.login-email=${LOGIN_EMAIL_SELECTOR:input[type='text']}
naukri.selectors.login-password=${LOGIN_PASSWORD_SELECTOR:input[type='password']}
naukri.selectors.login-submit=${LOGIN_SUBMIT_SELECTOR:button[type='submit']}
naukri.selectors.resume-input=${RESUME_INPUT_SELECTOR:input[value='Update resume']}
naukri.selectors.resume-save=${RESUME_SAVE_SELECTOR:button:has-text('Save')}

